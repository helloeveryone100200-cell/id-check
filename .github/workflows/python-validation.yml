name: Python validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile-and-handler-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile bot.py telegram-bot/main.py telegram-bot/web_server.py

      - name: Smoke-test handler registration and group keyboards
        env:
          BOT_TOKEN: "123456:TEST_TOKEN_FOR_HANDLER_SMOKE_TEST"
        run: |
          python - <<'PY'
          import asyncio
          import ast
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from types import SimpleNamespace
          from telegram import Chat, Message, MessageEntity, Update, User

          sys.path.insert(0, "telegram-bot")
          import main as bot

          # Register all handlers without making a Telegram API request or
          # starting polling. Capture the built Application to test dispatch.
          registered_applications = []
          original_run_polling = bot.Application.run_polling
          try:
              def capture_application(application, *args, **kwargs):
                  registered_applications.append(application)
              bot.Application.run_polling = capture_application
              bot.main()
          finally:
              bot.Application.run_polling = original_run_polling

          assert len(registered_applications) == 1
          registered_app = registered_applications[0]
          setmsg_handler = next(
              handler
              for handler in registered_app.handlers.get(0, [])
              if isinstance(handler, bot.ConversationHandler)
              and any(
                  isinstance(entry, bot.CommandHandler)
                  and "setmsg" in entry.commands
                  for entry in handler.entry_points
              )
          )
          # The /setmsg conversation gets first priority in group 0; the
          # persistent-keyboard handler remains in group -1 by design.
          assert registered_app.handlers[0][0] is setmsg_handler
          command_update = Update(
              update_id=987654,
              message=Message(
                  message_id=1,
                  date=datetime.now(timezone.utc),
                  chat=Chat(id=123456, type="private"),
                  from_user=User(id=123456, first_name="Owner", is_bot=False),
                  text="/setmsg",
                  entities=[MessageEntity(
                      type=MessageEntity.BOT_COMMAND, offset=0, length=7
                  )],
              ),
          )
          command_update.message.set_bot(registered_app.bot)
          assert setmsg_handler.check_update(command_update) is not None

          # The owner must receive /setmsg in their private command menu even
          # when OWNER_ID is not duplicated in ADMIN_IDS.
          original_admin_ids = bot.ADMIN_IDS
          previous_owner_id = os.environ.get("OWNER_ID")
          try:
              bot.ADMIN_IDS = [111]
              os.environ["OWNER_ID"] = "222"
              admin_command_names = {
                  command.command for command in bot._admin_bot_commands()
              }
              assert "setmsg" in admin_command_names
              assert bot._admin_command_menu_ids() == [111, 222]
          finally:
              bot.ADMIN_IDS = original_admin_ids
              if previous_owner_id is None:
                  os.environ.pop("OWNER_ID", None)
              else:
                  os.environ["OWNER_ID"] = previous_owner_id

          # Prove that /setmsg responds with the available editor options and
          # includes the schedule-management message entry.
          class FakeMessage:
              def __init__(self):
                  self.sent = []
              async def reply_text(self, text, **kwargs):
                  self.sent.append((text, kwargs))

          fake_message = FakeMessage()
          setmsg_owner_id = os.environ.get("OWNER_ID")
          try:
              os.environ["OWNER_ID"] = "123456"
              fake_update = SimpleNamespace(
                  message=fake_message,
                  effective_user=SimpleNamespace(id=123456),
                  effective_chat=SimpleNamespace(type="private"),
              )
              fake_context = SimpleNamespace(
                  application=SimpleNamespace(bot_data={}),
                  user_data={},
              )
              result = asyncio.run(bot.setmsg_start(fake_update, fake_context))
              assert result == bot.SETMSG_SELECT
              assert len(fake_message.sent) == 1
              markup = fake_message.sent[0][1]["reply_markup"]
              visible_buttons = [
                  button
                  for row in markup.inline_keyboard
                  for button in row
              ]
              assert any(
                  button.callback_data == "setmsg_schedule_management_message"
                  and button.text == bot.CUSTOM_MSG_LABELS["schedule_management_message"]
                  for button in visible_buttons
              )
          finally:
              if setmsg_owner_id is None:
                  os.environ.pop("OWNER_ID", None)
              else:
                  os.environ["OWNER_ID"] = setmsg_owner_id

          private_buttons = [
              button.text
              for row in bot._main_reply_keyboard({}, include_schedule=False).keyboard
              for button in row
          ]
          group_buttons = [
              button.text
              for row in bot._main_reply_keyboard({}, include_schedule=True).keyboard
              for button in row
          ]

          assert "Schedule" not in private_buttons
          assert "Set Schedule" not in private_buttons
          assert "Remove Schedule" not in private_buttons
          assert "Schedule" in group_buttons
          assert "Set Schedule" not in group_buttons
          assert "Remove Schedule" not in group_buttons
          assert "schedule_admin_only" in bot.DEFAULT_MSGS
          assert "schedule_admin_only" in bot.CUSTOM_MSG_LABELS
          assert "schedule_management_message" in bot.DEFAULT_MSGS
          assert bot.get_msg(
              {}, "schedule_management_message"
          ) == "📅 Schedule Management\nManage this group's schedules privately with the bot."
          print("Handler registration and Schedule-only group keyboard checks passed.")

          # Schedule PM links are short, one-use, user-bound, and group/action scoped.
          set_link = bot._create_schedule_pm_token(111, -222, "set")
          assert len(set_link) <= 64 and set_link.startswith("sched_")
          assert bot._consume_schedule_pm_token(set_link, 999) is None
          set_payload = bot._consume_schedule_pm_token(set_link, 111)
          assert set_payload["user_id"] == 111
          assert set_payload["group_id"] == -222
          assert set_payload["action"] == "set"
          assert bot._consume_schedule_pm_token(set_link, 111) is None
          remove_link = bot._create_schedule_pm_token(111, -333, "remove")
          remove_payload = bot._consume_schedule_pm_token(remove_link, 111)
          assert remove_payload["group_id"] == -333
          assert remove_payload["action"] == "remove"

          expired_link = bot._create_schedule_pm_token(111, -444, "set")
          expired_token = expired_link[len("sched_"):]
          bot._SCHEDULE_PM_TOKENS[expired_token]["expires_at"] = (
              bot.datetime.now(bot.pytz.UTC).timestamp() - 1
          )
          assert bot._consume_schedule_pm_token(expired_link, 111) is None
          print("Schedule PM token expiry/one-time/user/group/action checks passed.")

          # A stale Delete callback from a group must redirect to PM, never mutate
          # the schedule or write to MongoDB from that group message.
          class FakeQuery:
              def __init__(self):
                  self.data = "sched_remove_delete_abc123"
                  self.answers = []
                  self.message = SimpleNamespace(chat_id=-222)

              async def answer(self, **kwargs):
                  self.answers.append(kwargs)

          group_schedule = {
              "hour": 9, "minute": 30, "message": "hello",
              "group_ids": [-222], "type": "daily",
          }
          fake_query = FakeQuery()
          fake_update = SimpleNamespace(
              callback_query=fake_query,
              effective_chat=SimpleNamespace(id=-222, type="supergroup"),
              effective_user=SimpleNamespace(id=111),
              effective_message=None,
              message=None,
          )
          fake_bot_data = {"schedules": {"abc123": group_schedule}}
          fake_context = SimpleNamespace(
              application=SimpleNamespace(bot_data=fake_bot_data),
              user_data={},
              bot=SimpleNamespace(),
          )
          original_is_admin = bot._is_group_schedule_admin
          original_deep_link = bot._schedule_pm_deep_link
          original_delete = bot.delete_schedule_from_mongo
          original_save = bot.save_schedule_to_mongo
          persistence_writes = []

          async def allow_fake_admin(context, user_id, group_id):
              return user_id == 111 and group_id == -222

          async def fake_deep_link(context, parameter):
              return f"https://t.me/test_bot?start={parameter}"

          def track_delete(sched_id):
              persistence_writes.append(("delete", sched_id))
              return True

          def track_save(sched_id, schedule):
              persistence_writes.append(("save", sched_id))
              return True

          try:
              bot._is_group_schedule_admin = allow_fake_admin
              bot._schedule_pm_deep_link = fake_deep_link
              bot.delete_schedule_from_mongo = track_delete
              bot.save_schedule_to_mongo = track_save
              asyncio.run(bot.schedule_remove_callback(fake_update, fake_context))
          finally:
              bot._is_group_schedule_admin = original_is_admin
              bot._schedule_pm_deep_link = original_deep_link
              bot.delete_schedule_from_mongo = original_delete
              bot.save_schedule_to_mongo = original_save

          assert fake_query.answers
          assert fake_query.answers[0]["url"].startswith("https://t.me/test_bot?start=sched_")
          assert persistence_writes == []
          assert fake_bot_data["schedules"]["abc123"]["group_ids"] == [-222]
          print("Legacy group Delete callback PM-redirect/no-mutation regression test passed.")

          # Regression: the custom schedule message contains a {message} placeholder,
          # which must not collide with _reply_custom's target Telegram message argument.
          class FakeMessage:
              def __init__(self):
                  self.text = None
                  self.kwargs = None

              async def reply_text(self, text, **kwargs):
                  self.text = text
                  self.kwargs = kwargs

          target = FakeMessage()
          asyncio.run(bot._reply_custom(
              target,
              {},
              "schedule_remove_confirm",
              message="raw <6 & untrusted text",
          ))
          assert "raw <6 & untrusted text" in target.text
          assert "{message}" not in target.text
          print("Schedule confirmation placeholder regression test passed.")

          # Regression: admin error reports must be safe for arbitrary exception text.
          class FakeBot:
              def __init__(self):
                  self.sent = []

              async def send_message(self, **kwargs):
                  self.sent.append(kwargs)

          class FakeApplication:
              def __init__(self):
                  self.bot_data = {}
                  self.bot = FakeBot()

          class FakeContext:
              def __init__(self):
                  self.error = ValueError("Entity_text_invalid: <6 & unsafe")
                  self.application = FakeApplication()

          ctx = FakeContext()
          original_admin_ids = bot.ADMIN_IDS
          try:
              bot.ADMIN_IDS = [123456789]
              asyncio.run(bot.error_handler(None, ctx))
          finally:
              bot.ADMIN_IDS = original_admin_ids

          assert len(ctx.application.bot.sent) == 1
          admin_report = ctx.application.bot.sent[0]
          assert "Entity_text_invalid: <6 & unsafe" in admin_report["text"]
          assert "parse_mode" not in admin_report
          print("Plain-text admin error reporting regression test passed.")

          # Regression: a clean Render shutdown must not restart the same poller
          # inside a closed event loop.
          tree = ast.parse(Path("telegram-bot/main.py").read_text(encoding="utf-8"))
          main_guard = [
              node for node in tree.body
              if isinstance(node, ast.If)
              and isinstance(node.test, ast.Compare)
              and isinstance(node.test.left, ast.Name)
              and node.test.left.id == "__name__"
          ]
          assert main_guard
          assert not any(isinstance(node, ast.While) for node in ast.walk(main_guard[-1]))
          print("Single-run polling shutdown regression test passed.")
          PY
