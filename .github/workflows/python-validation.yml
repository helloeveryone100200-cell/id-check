name: Python validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile-and-handler-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile bot.py telegram-bot/main.py telegram-bot/web_server.py

      - name: Smoke-test handler registration and group keyboards
        env:
          BOT_TOKEN: "123456:TEST_TOKEN_FOR_HANDLER_SMOKE_TEST"
        run: |
          python - <<'PY'
          import asyncio
          import ast
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from types import SimpleNamespace
          from telegram import Chat, Message, MessageEntity, Update, User

          sys.path.insert(0, "telegram-bot")
          import main as bot

          # Register all handlers without making a Telegram API request or
          # starting polling. Capture the built Application to test dispatch.
          registered_applications = []
          original_run_polling = bot.Application.run_polling
          try:
              def capture_application(application, *args, **kwargs):
                  registered_applications.append(application)
              bot.Application.run_polling = capture_application
              bot.main()
          finally:
              bot.Application.run_polling = original_run_polling

          assert len(registered_applications) == 1
          registered_app = registered_applications[0]
          setmsg_handler = next(
              handler
              for handler in registered_app.handlers.get(0, [])
              if isinstance(handler, bot.ConversationHandler)
              and any(
                  isinstance(entry, bot.CommandHandler)
                  and "setmsg" in entry.commands
                  for entry in handler.entry_points
              )
          )
          # Schedule PM conversation is first in group 0 so active time/message
          # input cannot be intercepted by another conversation's broad text state.
          schedule_handler = next(
              handler
              for handler in registered_app.handlers.get(0, [])
              if isinstance(handler, bot.ConversationHandler)
              and any(
                  isinstance(entry, bot.CommandHandler)
                  and "start" in entry.commands
                  for entry in handler.entry_points
              )
              and any(
                  isinstance(entry, bot.CommandHandler)
                  and "setschedule" in entry.commands
                  for entry in handler.entry_points
              )
          )
          assert registered_app.handlers[0][0] is schedule_handler
          assert registered_app.handlers[0].index(schedule_handler) < (
              registered_app.handlers[0].index(setmsg_handler)
          )
          command_update = Update(
              update_id=987654,
              message=Message(
                  message_id=1,
                  date=datetime.now(timezone.utc),
                  chat=Chat(id=123456, type="private"),
                  from_user=User(id=123456, first_name="Owner", is_bot=False),
                  text="/setmsg",
                  entities=[MessageEntity(
                      type=MessageEntity.BOT_COMMAND, offset=0, length=7
                  )],
              ),
          )
          # CommandHandler only needs a bot username for this synthetic update.
          command_update.message._bot = SimpleNamespace(username="smoke_test_bot")
          assert setmsg_handler.check_update(command_update) is not None

          # Reproduce the exact schedule PM deep-link -> time entry flow without
          # a Telegram API call. This guards against silent loss of the time state.
          schedule_replies = []
          original_consume_token = bot._consume_schedule_pm_token
          original_require_schedule_admin = bot._require_group_schedule_admin
          original_reply_custom = bot._reply_custom

          async def fake_schedule_reply(target, bot_data, key, **kwargs):
              schedule_replies.append((key, kwargs))

          async def fake_schedule_admin_check(update, context):
              return True

          schedule_context = SimpleNamespace(
              args=["sched_testtoken"],
              user_data={},
              application=SimpleNamespace(bot_data={"custom_msgs": {}}),
          )
          schedule_message = SimpleNamespace(text="/start sched_testtoken")
          schedule_update = SimpleNamespace(
              effective_chat=SimpleNamespace(type="private", id=123456),
              effective_user=SimpleNamespace(id=123456),
              message=schedule_message,
              effective_message=schedule_message,
          )
          try:
              bot._consume_schedule_pm_token = lambda parameter, user_id: {
                  "group_id": -1001234567890,
                  "action": "set",
              }
              bot._require_group_schedule_admin = fake_schedule_admin_check
              bot._reply_custom = fake_schedule_reply

              entry_state = asyncio.run(bot.schedule_start_entry(
                  schedule_update, schedule_context
              ))
              assert entry_state == bot.SCHEDULE_SET_TIME
              assert schedule_replies[-1][0] == "schedule_time_prompt"
              assert schedule_context.user_data["schedule_pm_group_id"] == -1001234567890
              assert schedule_context.user_data["schedule_pm_action"] == "set"

              schedule_time_update = SimpleNamespace(
                  effective_chat=SimpleNamespace(type="private", id=123456),
                  effective_user=SimpleNamespace(id=123456),
                  effective_message=SimpleNamespace(text="09:30"),
              )
              time_state = asyncio.run(bot.schedule_set_time(
                  schedule_time_update, schedule_context
              ))
              assert time_state == bot.SCHEDULE_SET_MESSAGE
              assert schedule_context.user_data["new_schedule_hour"] == 9
              assert schedule_context.user_data["new_schedule_minute"] == 30
              assert schedule_replies[-1][0] == "schedule_message_prompt"
              assert schedule_replies[-1][1]["time"] == "09:30"
          finally:
              bot._consume_schedule_pm_token = original_consume_token
              bot._require_group_schedule_admin = original_require_schedule_admin
              bot._reply_custom = original_reply_custom

          # The owner must receive /setmsg in their private command menu even
          # when OWNER_ID is not duplicated in ADMIN_IDS.
          original_admin_ids = bot.ADMIN_IDS
          previous_owner_id = os.environ.get("OWNER_ID")
          try:
              bot.ADMIN_IDS = [111]
              os.environ["OWNER_ID"] = "222"
              admin_command_names = {
                  command.command for command in bot._admin_bot_commands()
              }
              assert "setmsg" in admin_command_names
              assert bot._admin_command_menu_ids() == [111, 222]
          finally:
              bot.ADMIN_IDS = original_admin_ids
              if previous_owner_id is None:
                  os.environ.pop("OWNER_ID", None)
              else:
                  os.environ["OWNER_ID"] = previous_owner_id

          # Prove that /setmsg responds with the available editor options and
          # includes the schedule-management message entry.
          class FakeMessage:
              def __init__(self):
                  self.sent = []
                  self.reject_custom_icon = True
              async def reply_text(self, text, **kwargs):
                  markup = kwargs.get("reply_markup")
                  buttons = [
                      button for row in getattr(markup, "inline_keyboard", [])
                      for button in row
                  ]
                  if self.reject_custom_icon and any(
                      getattr(button, "icon_custom_emoji_id", None)
                      for button in buttons
                  ):
                      self.reject_custom_icon = False
                      raise bot.BadRequest("custom emoji buttons are unavailable")
                  self.sent.append((text, kwargs))

          fake_message = FakeMessage()
          setmsg_owner_id = os.environ.get("OWNER_ID")
          original_get_custom_emoji_id = bot._get_first_custom_emoji_id
          try:
              os.environ["OWNER_ID"] = "123456"
              bot._get_first_custom_emoji_id = lambda *args: "987654"
              fake_update = SimpleNamespace(
                  message=fake_message,
                  effective_user=SimpleNamespace(id=123456),
                  effective_chat=SimpleNamespace(type="private"),
              )
              fake_context = SimpleNamespace(
                  application=SimpleNamespace(bot_data={}),
                  user_data={},
              )
              result = asyncio.run(bot.setmsg_start(fake_update, fake_context))
              assert result == bot.SETMSG_SELECT
              assert len(fake_message.sent) == 1
              markup = fake_message.sent[0][1]["reply_markup"]
              visible_buttons = [
                  button
                  for row in markup.inline_keyboard
                  for button in row
              ]
              assert any(
                  button.callback_data == "setmsg_page_1"
                  for button in visible_buttons
              )
              assert not any(
                  getattr(button, "icon_custom_emoji_id", None)
                  for button in visible_buttons
              )
              assert fake_message.reject_custom_icon is False

              # The schedule-management message remains on a later page and
              # retains its animated custom-emoji icon rather than stripping
              # icons across the entire menu.
              menu_keys = list(bot.CUSTOM_MSG_LABELS)
              schedule_page = (
                  menu_keys.index("schedule_management_message")
                  // bot.SETMSG_MENU_PAGE_SIZE
              )
              schedule_markup, has_icons, page, page_count = (
                  bot._setmsg_menu_keyboard({}, 123456, schedule_page)
              )
              schedule_buttons = [
                  button for row in schedule_markup.inline_keyboard
                  for button in row
              ]
              schedule_button = next(
                  button for button in schedule_buttons
                  if button.callback_data == "setmsg_schedule_management_message"
              )
              assert has_icons
              assert getattr(schedule_button, "icon_custom_emoji_id", None) == "987654"
              assert page == schedule_page
              assert page_count > 1
          finally:
              bot._get_first_custom_emoji_id = original_get_custom_emoji_id
              if setmsg_owner_id is None:
                  os.environ.pop("OWNER_ID", None)
              else:
                  os.environ["OWNER_ID"] = setmsg_owner_id

          # Custom animated emoji IDs must be sent through Telegram's button
          # icon field instead of leaving only the fallback Unicode glyph in text.
          def custom_emoji_config(text, emoji, custom_emoji_id):
              idx = text.index(emoji)
              return {
                  "text": text,
                  "entities": [{
                      "type": "custom_emoji",
                      "offset": bot._utf16_len(text[:idx]),
                      "length": bot._utf16_len(emoji),
                      "custom_emoji_id": custom_emoji_id,
                  }],
              }

          schedule_emoji_data = {
              "custom_msgs": {
                  "schedule_menu_button": custom_emoji_config(
                      "🔥 Schedule", "🔥", "710000000000001"
                  ),
                  "schedule_set_button": custom_emoji_config(
                      "✨ Set Schedule", "✨", "710000000000002"
                  ),
                  "schedule_remove_button": custom_emoji_config(
                      "🚀 Remove Schedule", "🚀", "710000000000003"
                  ),
              }
          }
          reply_schedule_button = bot._schedule_keyboard_button(
              schedule_emoji_data, "schedule_menu_button", style="primary"
          )
          inline_set_button = bot._schedule_keyboard_button(
              schedule_emoji_data,
              "schedule_set_button",
              callback_data="schedule_pm_open_set",
              style="primary",
          )
          inline_remove_button = bot._schedule_keyboard_button(
              schedule_emoji_data,
              "schedule_remove_button",
              callback_data="schedule_pm_open_remove",
              style="danger",
          )
          assert reply_schedule_button.text == "Schedule"
          assert reply_schedule_button.icon_custom_emoji_id == "710000000000001"
          assert inline_set_button.text == "Set Schedule"
          assert inline_set_button.icon_custom_emoji_id == "710000000000002"
          assert inline_remove_button.text == "Remove Schedule"
          assert inline_remove_button.icon_custom_emoji_id == "710000000000003"
          assert "🔥 Schedule" in bot._schedule_keyboard_labels(
              schedule_emoji_data, "schedule_menu_button"
          ), "legacy reply-keyboard labels must still route after deployment"
          actual_group_schedule = next(
              button
              for row in bot._main_reply_keyboard(
                  schedule_emoji_data, include_schedule=True
              ).keyboard
              for button in row
              if getattr(button, "icon_custom_emoji_id", None)
          )
          assert actual_group_schedule.text == "Schedule"
          assert actual_group_schedule.icon_custom_emoji_id == "710000000000001"

          # Custom emojis in counter row/total templates and the animated
          # digits substituted into {count}/{grand_total} must all be entities
          # on the outgoing Telegram message, with UTF-16 offsets kept correct.
          digit_text = "😀😁😂🤣😃😄😅😆😉😊"
          digit_entities = []
          for digit_index, emoji in enumerate(digit_text):
              digit_entities.append({
                  "type": "custom_emoji",
                  "offset": bot._utf16_len(digit_text[:digit_index]),
                  "length": bot._utf16_len(emoji),
                  "custom_emoji_id": str(900000000000000 + digit_index),
              })
          row_text = "{i}. {name}: {count} 🔥"
          grand_text = "Grand total: {grand_total} 🏆"
          counter_emoji_data = {
              "custom_msgs": {
                  "digit_emoji": {
                      "text": digit_text,
                      "entities": digit_entities,
                  },
                  "total_plus_row": custom_emoji_config(
                      row_text, "🔥", "710000000000011"
                  ),
                  "total_plus_grand": custom_emoji_config(
                      grand_text, "🏆", "710000000000012"
                  ),
              }
          }
          class FakeCounterMessage:
              def __init__(self):
                  self.sent = []
              async def reply_text(self, text, **kwargs):
                  self.sent.append((text, kwargs))

          counter_message = FakeCounterMessage()
          asyncio.run(bot._send_total_plus(
              counter_message,
              counter_emoji_data,
              entries={"user-1": 23},
              grand_total=46,
              names={"user-1": "Alice"},
          ))
          assert len(counter_message.sent) == 1
          counter_text, counter_kwargs = counter_message.sent[0]
          counter_entities = counter_kwargs["entities"]
          custom_ids = {
              entity.custom_emoji_id
              for entity in counter_entities
              if entity.type == "custom_emoji"
          }
          assert "710000000000011" in custom_ids
          assert "710000000000012" in custom_ids
          assert "900000000000002" in custom_ids
          assert "900000000000003" in custom_ids
          assert "900000000000004" in custom_ids
          assert "900000000000006" in custom_ids
          row_icon_entity = next(
              entity for entity in counter_entities
              if entity.custom_emoji_id == "710000000000011"
          )
          grand_icon_entity = next(
              entity for entity in counter_entities
              if entity.custom_emoji_id == "710000000000012"
          )
          assert row_icon_entity.offset == bot._utf16_len(
              counter_text[:counter_text.index("🔥")]
          )
          assert grand_icon_entity.offset == bot._utf16_len(
              counter_text[:counter_text.index("🏆")]
          )

          # All user-facing reply-keyboard labels can be customized independently.
          # Each custom emoji is moved into Telegram's dedicated icon field.
          custom_reply_button_specs = {
              "showdata_button": ("🔥 Daily Report", "🔥", "720000000000001", "Showdata"),
              "total_plus_button": ("💎 Plus Summary", "💎", "720000000000002", "Total Plus"),
              "clear_data_button": ("🧹 Clear Today", "🧹", "720000000000003", "Clear Data"),
              "reset_plus_button": ("🔁 Reset Counter", "🔁", "720000000000004", "Reset Plus"),
              "clear_all_button": ("🧽 Clear All Data", "🧽", "720000000000005", "Clear All"),
              "reset_plus_all_button": ("🔒 Reset All Counters", "🔒", "720000000000006", "Reset Plus All"),
              "number_words_button": ("🔢 Number Converter", "🔢", "720000000000007", "Numbers to Words Converter"),
              "schedule_menu_button": ("📅 Schedule Now", "📅", "720000000000008", "Schedule"),
          }
          custom_keyboard_data = {"custom_msgs": {}}
          # Save the old labels before applying the custom labels, preserving
          # route compatibility for ReplyKeyboards clients may still be showing.
          for button_key, (_, _, _, _) in custom_reply_button_specs.items():
              bot._remember_schedule_button_alias(custom_keyboard_data, button_key)
          for button_key, (raw_text, emoji, emoji_id, _) in custom_reply_button_specs.items():
              custom_keyboard_data["custom_msgs"][button_key] = custom_emoji_config(
                  raw_text, emoji, emoji_id
              )

          custom_group_keyboard = bot._main_reply_keyboard(
              custom_keyboard_data, include_schedule=True
          )
          custom_buttons_by_text = {
              button.text: button
              for row in custom_group_keyboard.keyboard
              for button in row
          }
          for button_key, (raw_text, emoji, emoji_id, original_label) in (
              custom_reply_button_specs.items()
          ):
              display_label = raw_text.replace(emoji, "", 1).strip()
              button = custom_buttons_by_text[display_label]
              assert button.icon_custom_emoji_id == emoji_id, button_key
              assert original_label in bot._schedule_keyboard_labels(
                  custom_keyboard_data, button_key
              ), f"previous label no longer routes: {button_key}"
              assert button.text == display_label

          # Clicking either the new custom label or a stale old label still runs
          # the same underlying action, not a text-dependent hard-coded command.
          action_handlers = {
              "showdata_button": "show_data",
              "total_plus_button": "total_plus_command",
              "clear_data_button": "clear_data",
              "reset_plus_button": "reset_plus_command",
              "clear_all_button": "admin_clearall_command",
              "reset_plus_all_button": "admin_resetplusall_command",
          }
          original_action_handlers = {
              key: getattr(bot, function_name)
              for key, function_name in action_handlers.items()
          }
          dispatched_actions = []
          try:
              for button_key, function_name in action_handlers.items():
                  async def record_action(update, context, action_key=button_key):
                      dispatched_actions.append(action_key)
                  setattr(bot, function_name, record_action)

              route_context = SimpleNamespace(
                  application=SimpleNamespace(bot_data=custom_keyboard_data)
              )
              route_update = SimpleNamespace(
                  message=SimpleNamespace(text="")
              )
              display_labels = {
                  key: raw.replace(emoji, "", 1).strip()
                  for key, (raw, emoji, _, _) in custom_reply_button_specs.items()
              }
              for button_key, function_name in action_handlers.items():
                  for label in (
                      display_labels[button_key],
                      custom_reply_button_specs[button_key][3],
                  ):
                      route_update.message.text = label
                      asyncio.run(bot.main_menu_text_handler(
                          route_update, route_context
                      ))
                      assert dispatched_actions[-1] == button_key, (button_key, label)
          finally:
              for button_key, function_name in action_handlers.items():
                  setattr(bot, function_name, original_action_handlers[button_key])

          # The Number Converter's updated label is recognized by its separate
          # private-only ConversationHandler entry point as well.
          registered_app.bot_data.update(custom_keyboard_data)
          number_words_handler = next(
              handler
              for handler in registered_app.handlers.get(0, [])
              if isinstance(handler, bot.MessageHandler)
              and handler.callback is bot.number_words_start
          )
          number_update = Update(
              update_id=987655,
              message=Message(
                  message_id=2,
                  date=datetime.now(timezone.utc),
                  chat=Chat(id=123456, type="private"),
                  from_user=User(id=123456, first_name="Owner", is_bot=False),
                  text="Number Converter",
              ),
          )
          assert number_words_handler.check_update(number_update) is not None

          private_buttons = [
              button.text
              for row in bot._main_reply_keyboard({}, include_schedule=False).keyboard
              for button in row
          ]
          group_buttons = [
              button.text
              for row in bot._main_reply_keyboard({}, include_schedule=True).keyboard
              for button in row
          ]

          assert "Schedule" not in private_buttons
          assert "Set Schedule" not in private_buttons
          assert "Remove Schedule" not in private_buttons
          assert "Schedule" in group_buttons
          assert "Set Schedule" not in group_buttons
          assert "Remove Schedule" not in group_buttons
          assert "schedule_admin_only" in bot.DEFAULT_MSGS
          assert "schedule_admin_only" in bot.CUSTOM_MSG_LABELS
          assert "schedule_management_message" in bot.DEFAULT_MSGS
          assert bot.get_msg(
              {}, "schedule_management_message"
          ) == "📅 Schedule Management\nManage this group's schedules privately with the bot."
          print("Handler registration and Schedule-only group keyboard checks passed.")

          # Schedule PM links are short, one-use, user-bound, and group/action scoped.
          set_link = bot._create_schedule_pm_token(111, -222, "set")
          assert len(set_link) <= 64 and set_link.startswith("sched_")
          assert bot._consume_schedule_pm_token(set_link, 999) is None
          set_payload = bot._consume_schedule_pm_token(set_link, 111)
          assert set_payload["user_id"] == 111
          assert set_payload["group_id"] == -222
          assert set_payload["action"] == "set"
          assert bot._consume_schedule_pm_token(set_link, 111) is None
          remove_link = bot._create_schedule_pm_token(111, -333, "remove")
          remove_payload = bot._consume_schedule_pm_token(remove_link, 111)
          assert remove_payload["group_id"] == -333
          assert remove_payload["action"] == "remove"

          expired_link = bot._create_schedule_pm_token(111, -444, "set")
          expired_token = expired_link[len("sched_"):]
          bot._SCHEDULE_PM_TOKENS[expired_token]["expires_at"] = (
              bot.datetime.now(bot.pytz.UTC).timestamp() - 1
          )
          assert bot._consume_schedule_pm_token(expired_link, 111) is None
          print("Schedule PM token expiry/one-time/user/group/action checks passed.")

          # A stale Delete callback from a group must redirect to PM, never mutate
          # the schedule or write to MongoDB from that group message.
          class FakeQuery:
              def __init__(self):
                  self.data = "sched_remove_delete_abc123"
                  self.answers = []
                  self.message = SimpleNamespace(chat_id=-222)

              async def answer(self, **kwargs):
                  self.answers.append(kwargs)

          group_schedule = {
              "hour": 9, "minute": 30, "message": "hello",
              "group_ids": [-222], "type": "daily",
          }
          fake_query = FakeQuery()
          fake_update = SimpleNamespace(
              callback_query=fake_query,
              effective_chat=SimpleNamespace(id=-222, type="supergroup"),
              effective_user=SimpleNamespace(id=111),
              effective_message=None,
              message=None,
          )
          fake_bot_data = {"schedules": {"abc123": group_schedule}}
          fake_context = SimpleNamespace(
              application=SimpleNamespace(bot_data=fake_bot_data),
              user_data={},
              bot=SimpleNamespace(),
          )
          original_is_admin = bot._is_group_schedule_admin
          original_deep_link = bot._schedule_pm_deep_link
          original_delete = bot.delete_schedule_from_mongo
          original_save = bot.save_schedule_to_mongo
          persistence_writes = []

          async def allow_fake_admin(context, user_id, group_id):
              return user_id == 111 and group_id == -222

          async def fake_deep_link(context, parameter):
              return f"https://t.me/test_bot?start={parameter}"

          def track_delete(sched_id):
              persistence_writes.append(("delete", sched_id))
              return True

          def track_save(sched_id, schedule):
              persistence_writes.append(("save", sched_id))
              return True

          try:
              bot._is_group_schedule_admin = allow_fake_admin
              bot._schedule_pm_deep_link = fake_deep_link
              bot.delete_schedule_from_mongo = track_delete
              bot.save_schedule_to_mongo = track_save
              asyncio.run(bot.schedule_remove_callback(fake_update, fake_context))
          finally:
              bot._is_group_schedule_admin = original_is_admin
              bot._schedule_pm_deep_link = original_deep_link
              bot.delete_schedule_from_mongo = original_delete
              bot.save_schedule_to_mongo = original_save

          assert fake_query.answers
          assert fake_query.answers[0]["url"].startswith("https://t.me/test_bot?start=sched_")
          assert persistence_writes == []
          assert fake_bot_data["schedules"]["abc123"]["group_ids"] == [-222]
          print("Legacy group Delete callback PM-redirect/no-mutation regression test passed.")

          # Regression: the custom schedule message contains a {message} placeholder,
          # which must not collide with _reply_custom's target Telegram message argument.
          class FakeMessage:
              def __init__(self):
                  self.text = None
                  self.kwargs = None

              async def reply_text(self, text, **kwargs):
                  self.text = text
                  self.kwargs = kwargs

          target = FakeMessage()
          asyncio.run(bot._reply_custom(
              target,
              {},
              "schedule_remove_confirm",
              message="raw <6 & untrusted text",
          ))
          assert "raw <6 & untrusted text" in target.text
          assert "{message}" not in target.text
          print("Schedule confirmation placeholder regression test passed.")

          # Regression: admin error reports must be safe for arbitrary exception text.
          class FakeBot:
              def __init__(self):
                  self.sent = []

              async def send_message(self, **kwargs):
                  self.sent.append(kwargs)

          class FakeApplication:
              def __init__(self):
                  self.bot_data = {}
                  self.bot = FakeBot()

          class FakeContext:
              def __init__(self):
                  self.error = ValueError("Entity_text_invalid: <6 & unsafe")
                  self.application = FakeApplication()

          ctx = FakeContext()
          original_admin_ids = bot.ADMIN_IDS
          try:
              bot.ADMIN_IDS = [123456789]
              asyncio.run(bot.error_handler(None, ctx))
          finally:
              bot.ADMIN_IDS = original_admin_ids

          assert len(ctx.application.bot.sent) == 1
          admin_report = ctx.application.bot.sent[0]
          assert "Entity_text_invalid: <6 & unsafe" in admin_report["text"]
          assert "parse_mode" not in admin_report
          print("Plain-text admin error reporting regression test passed.")

          # Regression: a clean Render shutdown must not restart the same poller
          # inside a closed event loop.
          tree = ast.parse(Path("telegram-bot/main.py").read_text(encoding="utf-8"))
          main_guard = [
              node for node in tree.body
              if isinstance(node, ast.If)
              and isinstance(node.test, ast.Compare)
              and isinstance(node.test.left, ast.Name)
              and node.test.left.id == "__name__"
          ]
          assert main_guard
          assert not any(isinstance(node, ast.While) for node in ast.walk(main_guard[-1]))
          print("Single-run polling shutdown regression test passed.")
          PY
