name: Deposit Report Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "telegram-bot/main.py"
      - "telegram-bot/tests/**"
      - "telegram-bot/requirements.txt"
      - ".github/workflows/deposit-report-checks.yml"
  push:
    branches: [main, "fix/deposit-report-daily-auto-clear-only"]
    paths:
      - "telegram-bot/main.py"
      - "telegram-bot/tests/**"
      - "telegram-bot/requirements.txt"
      - ".github/workflows/deposit-report-checks.yml"

jobs:
  deposit-report-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-bot/requirements.txt
      - name: Install bot dependencies
        run: python -m pip install -r telegram-bot/requirements.txt
      - name: Compile bot and tests
        run: python -m compileall -q telegram-bot
      - name: Run Deposit Report tests
        run: python -m unittest discover -s telegram-bot/tests -v
